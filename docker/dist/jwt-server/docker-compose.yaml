services:
  ### for Keycloak 20 or later
  keycloak:
    init: true
    image: keycloak/keycloak:26.4
    hostname: keycloak
    container_name: gfarm-keycloak
    command:
      #- start-dev
      - start
    networks:
      gfarm_net:
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ../minica/keycloak/:/opt/keycloak/minica-cert:ro
    environment:
      # https://www.keycloak.org/server/all-config
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_DB=dev-file
      # https://www.keycloak.org/server/enabletls
      - KC_HTTPS_CERTIFICATE_FILE=/opt/keycloak/minica-cert/cert.pem
      - KC_HTTPS_CERTIFICATE_KEY_FILE=/opt/keycloak/minica-cert/key.pem
      - KC_PROXY_HEADERS=xforwarded
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HTTP_ENABLED=true
      - KC_HTTPS_PORT=8443
      - KC_HTTP_PORT=8080
      - KC_HTTP_RELATIVE_PATH=/auth
      - KC_HTTP_MANAGEMENT_PORT=443
      - KC_HEALTH_ENABLED=true   # :443/auth/health
      - KC_METRICS_ENABLED=true  # :443/auth/metrics
      - KC_LOG_LEVEL=INFO
      - KC_HTTP_ACCESS_LOG_ENABLED=true
      - 'KC_HTTP_ACCESS_LOG_PATTERN=%h %t "%m %R %H" %s %b'
  setup-keycloak:
    build: setup-keycloak
    image: gfarm-setup-keycloak
    hostname: setup-keycloak
    container_name: gfarm-setup-keycloak
    volumes:
      - ../minica/minica.pem:/myca.pem:ro
      - ./setup-keycloak:/setup-keycloak:ro
    networks:
      gfarm_net:
  jwt-server-front:
    image: gfarm-jwt-server:local
    hostname: jwt-server-front
    container_name: gfarm-jwt-server-front
    command: ["apache"]
    environment:
      - JWT_BACKEND=jwt-server-back-ajp
    volumes:
      - ../minica/jwt-server/cert.pem:/etc/pki/tls/certs/localhost.crt
      - ../minica/jwt-server/key.pem:/etc/pki/tls/private/localhost.key
    depends_on:
      jwt-server-back:
        condition: service_started
    networks:
      gfarm_net:
        aliases:
          - jwt-server
      jwt-server-front-back:
  jwt-server-back:
    build:
      context: jwt-server
      args:
        MAVEN_OPTS: >-
          -Dhttp.proxyHost=${PROXY_HOST:-}
          -Dhttp.proxyPort=${PROXY_PORT:-}
          -Dhttps.proxyHost=${PROXY_HOST:-}
          -Dhttps.proxyPort=${PROXY_PORT:-}
    image: gfarm-jwt-server:local
    hostname: jwt-server-back
    container_name: gfarm-jwt-server-back
    command: ["tomcat"]
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://jwt-server-db:3306/gfarmdb
      - AJP_BIND_ADDRESS=172.21.0.10
    volumes:
      - ../minica/minica.pem:/usr/share/pki/ca-trust-source/anchors/minica.crt
      - ./jwt-server:/jwt:ro
    depends_on:
      jwt-server-db:
        condition: service_healthy
    networks:
      gfarm_net:
      jwt-server-front-back:
        ipv4_address: 172.21.0.10
        aliases:
          - jwt-server-back-ajp
      jwt-server-back-db:
        ipv4_address: 172.22.0.10
  jwt-server-db:
    image: gfarm-jwt-server:local
    hostname: jwt-server-db
    container_name: gfarm-jwt-server-db
    command: ["mariadb"]
    volumes:
      - jwt-server-data:/var/lib/mysql
      - ./jwt-server/cnf/master1.cnf:/etc/my.cnf.d/zz-master.cnf:ro
      - ./jwt-server:/jwt:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "--silent"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      jwt-server-back-db:
      jwt-server-db-replication:
  jwt-server2-front:
    image: gfarm-jwt-server:local
    hostname: jwt-server2-front
    container_name: gfarm-jwt-server2-front
    command: ["apache"]
    environment:
      - JWT_BACKEND=jwt-server2-back-ajp
    volumes:
      - ../minica/jwt-server2/cert.pem:/etc/pki/tls/certs/localhost.crt
      - ../minica/jwt-server2/key.pem:/etc/pki/tls/private/localhost.key
    depends_on:
      jwt-server2-back:
        condition: service_started
    networks:
      gfarm_net:
        aliases:
          - jwt-server2
      jwt-server-front-back:
  jwt-server2-back:
    image: gfarm-jwt-server:local
    hostname: jwt-server2-back
    container_name: gfarm-jwt-server2-back
    command: ["tomcat"]
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://jwt-server2-db:3306/gfarmdb
      - AJP_BIND_ADDRESS=172.21.0.11
    volumes:
      - ../minica/minica.pem:/usr/share/pki/ca-trust-source/anchors/minica.crt
      - ./jwt-server:/jwt:ro
    depends_on:
      jwt-server2-db:
        condition: service_healthy
    networks:
      gfarm_net:
      jwt-server-front-back:
        ipv4_address: 172.21.0.11
        aliases:
          - jwt-server2-back-ajp
      jwt-server-back-db:
        ipv4_address: 172.22.0.11
  jwt-server2-db:
    image: gfarm-jwt-server:local
    hostname: jwt-server2-db
    container_name: gfarm-jwt-server2-db
    command: ["mariadb"]
    volumes:
      - jwt-server2-data:/var/lib/mysql
      - ./jwt-server/cnf/master2.cnf:/etc/my.cnf.d/zz-master.cnf:ro
      - ./jwt-server:/jwt:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "--silent"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      jwt-server-back-db:
      jwt-server-db-replication:
  rdesktop:
    init: true
    build: rdesktop
    container_name: gfarm-rdesktop
    volumes:
      - ../minica/minica.pem:/minica/minica.pem
      - ./rdesktop:/rdesktop
    networks:
      - gfarm_net
    ports:
      - 13389:3389
  squid:
    init: true
    image: ubuntu/squid
    container_name: gfarm-squid
    networks:
      gfarm_net:
    ports:
      - 13128:3128
    volumes:
      - ../../dev/common/oauth2/allow-ssl-ports.conf:/etc/squid/conf.d/allow-ssl-ports.conf:ro

networks:
  gfarm_net:
    name: gfarm_net
    external: true
  jwt-server-front-back:
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/24
  jwt-server-back-db:
    internal: true
    ipam:
      config:
        - subnet: 172.22.0.0/24
  jwt-server-db-replication:
    internal: true
    ipam:
      config:
        - subnet: 172.23.0.0/24

volumes:
  keycloak-data:
  jwt-server-data:
  jwt-server2-data:
